[VehicleStats]
; 1 = enabled, 0 = disabled
Enabled = 1

; Trigger to open the statistics WHILE INSIDE a vehicle
UseKeyboard = 1
; TAB, CAPSLOCK, ENTER, SPACE, LSHIFT, LCTRL, LALT, F1..F12, or a letter
KeyboardKey = TAB
UsePad = 1
; L1, L2, R1, R2, UP, DOWN, LEFT, RIGHT, START, SELECT, SQUARE, TRIANGLE, CROSS, CIRCLE, L3, R3
PadButton = LEFT

; On foot, the screen opens using the game's original button.

[Layout]
; 1 = inside a vehicle, the "Stamina" row displays the current vehicle's skill
;     (car: driving, motorcycle: biking, bicycle: cycling, plane/helicopter: flying)
SkillRow = 1

[Percent]
; 1 = displays the percentage on the RIGHT side, inside each bar, in the quick stats window
;     (on foot and inside a vehicle), the pause menu stats screen, and the notification
;     displayed at the top of the screen when a skill is upgraded.
ShowPercent = 1
; Percentage text size (1.0 = default). Increase or decrease it if the text looks too large or too small.
TextScale = 1.0
; 1 = centers the value/percentage inside the bar (quick stats window, pause menu, and skill upgrade
;     notification). 0 = right-aligned (previous default).
CenterText = 1

; Only applies to the top notification (when a skill is upgraded):
; the "NN%" text is placed before the bar's right edge, leaving room for the game's "+" symbol.
;   NoticeRightPad = distance from the right edge, in multiples of the bar's height (higher = farther left)
;   NoticeWidthScale / NoticeWidthOffset = text width adjustment (if "100%" still overlaps, increase Scale)
NoticeRightPad = 1.2
NoticeWidthScale = 1.45
NoticeWidthOffset = 0.8